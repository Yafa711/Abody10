name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK
        run: npx expo run:android --variant debug --no-build-cache
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://rjcqkwgjqeqwzfbedwav.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1Uz2U4l6oUH67i7sjTyr0g_rwqRFPIO

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewElectroStore-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
