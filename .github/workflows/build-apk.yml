name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate metro.config.js
        run: npx expo customize metro.config.js 2>/dev/null || touch metro.config.js

      - name: Generate native Android project
        run: CI=true npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://rjcqkwgjqeqwzfbedwav.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1Uz2U4l6oUH67i7sjTyr0g_rwqRFPIO

      - name: Patch Android settings.gradle for CI compatibility
        run: |
          # Remove foojay-resolver-convention plugin which fails with gson 2.9.1 (403 from Maven Central)
          sed -i '/foojay-resolver-convention/d' android/settings.gradle
          echo "Patched settings.gradle after prebuild"

      - name: Bundle JS for Android
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ 2>&1
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://rjcqkwgjqeqwzfbedwav.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1Uz2U4l6oUH67i7sjTyr0g_rwqRFPIO

      - name: Verify bundle
        run: ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build Debug APK
        run: cd android && CI=true ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewElectroStore-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
